name: Sync Skill Matrix

# OPC-Studio 生态状态自动同步（registry.json 为唯一事实来源）
# 每日抓取各 skill 仓库的 latest release / star / fork 写入 registry.json，
# 再由 scripts/sync_registry.py 渲染 README 矩阵表与生态状态表；有变化时自动提交。
#
# 新增 skill：在 registry.json 的 skills 数组加一条（含 layer / theme / install），
# 跑一次本 workflow 或 `python3 scripts/sync_registry.py --render-only` 即全链路生效。

"on":
  schedule:
    - cron: "30 0 * * *"          # 每日 UTC 00:30（北京时间 08:30）
  workflow_dispatch:              # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch facts and render README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_registry.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "no changes"
          else
            git config user.name "opc-studio-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md registry.json
            git commit -m "chore: sync skill registry (release / star / fork)"
            git push
            echo "pushed"
          fi
